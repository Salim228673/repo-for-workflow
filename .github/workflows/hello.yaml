name: Deploy Project
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: action/checkout@v3
      - name: Install NodeJS
        uses: action/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: tests
        run: npm test
  Deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: action/checkout@v3
      - name: Install NodeJS
        uses: action/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deploying..."
